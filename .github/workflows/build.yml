name: Build

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check formatting
        run: dotnet format AiBuddy.csproj --verify-no-changes
      - name: Build
        run: dotnet build AiBuddy.csproj --configuration Release
